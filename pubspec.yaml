name: docsafe
description: "DocSafe – privacy-first encrypted document vault for Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management / DI.
  flutter_riverpod: ^3.4.3
  # Navigation with a lock-screen redirect guard.
  go_router: ^18.1.3
  # Typed SQL + migrations on top of sqlite3 (SQLCipher build, see hooks below).
  drift: ^2.35.3
  sqlite3: ^3.9.0
  # PDF rendering (PDFium) from a local file path.
  pdfrx: ^2.12.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Type-safe Dart <-> Kotlin bridge code generation (pigeons/security_api.dart).
  pigeon: ^29.1.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

# package:sqlite3 bundles SQLCipher (community edition) instead of plain SQLite.
# The app refuses to open the database unless `PRAGMA cipher_version` reports
# SQLCipher (see lib/core/database/database_opener.dart).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true
