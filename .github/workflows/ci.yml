name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  crypto-core:
    name: Crypto core (JVM unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit tests
        working-directory: native/docsafe-crypto
        run: ./gradlew test --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-core-test-results
          path: native/docsafe-crypto/build/test-results/

  flutter:
    name: Format, analyze, test, build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run pigeon --input pigeons/security_api.dart
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib
          git diff --exit-code -- lib android/app/src/main/kotlin
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test pigeons
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: docsafe-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  device:
    name: On-device security tests (emulator)
    runs-on: ubuntu-latest
    needs: [crypto-core, flutter]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build once so Gradle can run instrumentation tests
        run: flutter build apk --debug
      - name: Instrumented (Keystore) + Flutter integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            cd android && ./gradlew :app:connectedDebugAndroidTest --console=plain && cd ..
            flutter test integration_test -d emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumented-test-results
          path: build/app/outputs/androidTest-results/
