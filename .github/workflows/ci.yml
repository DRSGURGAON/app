name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  crypto-core:
    name: Crypto core (JVM unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Gradle distribution + dependency cache: fewer downloads that can time out.
          cache: gradle
      - name: Unit tests
        working-directory: native/docsafe-crypto
        run: ./gradlew test --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-core-test-results
          path: native/docsafe-crypto/build/test-results/

  flutter:
    name: Format, analyze, test, build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Gradle distribution + dependency cache: fewer downloads that can time out.
          cache: gradle
      - name: Cache PDFium binary (downloaded by the pdfium_dart build hook)
        uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run pigeon --input pigeons/security_api.dart
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib
          git diff --exit-code -- lib android/app/src/main/kotlin
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test pigeons
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release APK (R8) and audit its permissions
        # Release signing is configured in Phase 8; this build is debug-signed
        # and only used to verify minification and the merged manifest.
        run: |
          flutter build apk --release
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee release-permissions.txt
          if grep -E "permission: android.permission.(CAMERA|RECORD_AUDIO|INTERNET|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_[A-Z_]+|ACCESS_(FINE|COARSE)_LOCATION|READ_CONTACTS|READ_PHONE_STATE)" release-permissions.txt; then
            echo "::error::Unexpected permission in the release APK"
            exit 1
          fi
      - name: Audit release manifest (backup, debuggable) and debug-only test hooks
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump xmltree --file AndroidManifest.xml build/app/outputs/flutter-apk/app-release.apk > release-manifest.txt
          grep -E "allowBackup|dataExtractionRules|fullBackupContent|debuggable|usesCleartextTraffic" release-manifest.txt | tee -a release-permissions.txt
          grep -q 'allowBackup.*=0x0\|allowBackup.*false' release-manifest.txt || { echo "::error::allowBackup is not false"; exit 1; }
          if grep -q 'debuggable.*0xffffffff' release-manifest.txt; then echo "::error::release is debuggable"; exit 1; fi
          RELEASE_HITS=$(unzip -p build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' | grep -a -c "docsafe.debug/fixtures" || true)
          DEBUG_HITS=$(unzip -p build/app/outputs/flutter-apk/app-debug.apk 'classes*.dex' | grep -a -c "docsafe.debug/fixtures" || true)
          echo "test-fixture channel in release dex: $RELEASE_HITS, in debug dex: $DEBUG_HITS" | tee -a release-permissions.txt
          [ "$RELEASE_HITS" = "0" ] || { echo "::error::debug test fixtures present in release APK"; exit 1; }
          [ "$DEBUG_HITS" != "0" ] || { echo "::error::sanity check failed: fixtures missing from debug APK"; exit 1; }
      - name: Size report (universal APK vs per-ABI APKs vs App Bundle)
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release
          {
            echo "## Sizes"
            ls -l build/app/outputs/flutter-apk/*.apk | awk '{print $5, $9}'
            ls -l build/app/outputs/bundle/release/*.aab | awk '{print $5, $9}'
            echo "## Largest entries in the universal APK"
            unzip -lv build/app/outputs/flutter-apk/app-release.apk | sort -k1 -n -r | head -25
          } | tee size-report.txt
          flutter build apk --release --target-platform android-arm64 --analyze-size 2>&1 | tail -40 | tee -a size-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-audit
          path: |
            release-permissions.txt
            release-manifest.txt
            size-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: docsafe-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      # For manual phone testing: release build (R8, Premium locked, no developer switch),
      # arm64 only (almost every phone sold in India since ~2017). Signed with the CI
      # runner's throwaway debug key: NOT for distribution; uninstall before installing a
      # build from another run.
      - uses: actions/upload-artifact@v4
        with:
          name: docsafe-release-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

  device:
    name: On-device security tests (emulator)
    runs-on: ubuntu-latest
    needs: [crypto-core, flutter]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Gradle distribution + dependency cache: fewer downloads that can time out.
          cache: gradle
      - name: Cache PDFium binary (downloaded by the pdfium_dart build hook)
        uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared/pdfium_dart
          key: pdfium-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build once so Gradle can run instrumentation tests
        run: flutter build apk --debug
      - name: Instrumented (Keystore) + Flutter integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./tool/ci/device_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumented-test-results
          path: build/app/outputs/androidTest-results/
