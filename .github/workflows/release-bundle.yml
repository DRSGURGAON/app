name: Release bundle (signed AAB)

# Runs when the branch docsafe-release is created or updated (on github.com:
# branch menu -> type docsafe-release -> "Create branch ... from docsafe-main").
# The default branch belongs to another project, so a "Run workflow" button is
# not available. Builds an App Bundle
# signed with YOUR upload key and with the Play licence key compiled in, and
# keeps it as a downloadable artifact for 3 days. It never uploads or
# publishes anything: you upload the .aab in Play Console yourself.
#
# Repository secrets it needs (Settings -> Secrets and variables -> Actions):
#   UPLOAD_KEYSTORE_BASE64  the upload .jks file, base64-encoded
#   UPLOAD_STORE_PASSWORD   keystore password
#   UPLOAD_KEY_ALIAS        key alias (e.g. upload)
#   UPLOAD_KEY_PASSWORD     key password
#   PLAY_LICENSE_KEY        Play Console -> Monetize with Play -> Monetization setup -> Licensing

on:
  push:
    branches: [docsafe-release]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the secrets are set
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KA: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          LK: ${{ secrets.PLAY_LICENSE_KEY }}
        run: |
          missing=0
          for n in KS SP KA KP LK; do
            if [ -z "${!n}" ]; then echo "::error::missing secret ($n)"; missing=1; fi
          done
          exit $missing
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Unit and widget tests
        run: flutter test
      - name: Build the signed App Bundle
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          DOCSAFE_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          DOCSAFE_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          DOCSAFE_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          DOCSAFE_PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}
        run: |
          # The keystore only exists on this temporary runner and is deleted at the end.
          export DOCSAFE_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$DOCSAFE_UPLOAD_STORE_FILE"' EXIT
          # Spaces, tabs and Windows line breaks from copy/paste are ignored.
          if ! printf '%s' "$KS" | tr -d ' \t\r\n' | base64 -d > "$DOCSAFE_UPLOAD_STORE_FILE" 2>/dev/null; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is not valid base64. Re-create it with the PowerShell command in docs/RELEASE.md section 2b (it copies the text to the clipboard) and paste only that text."
            exit 1
          fi
          # A Java keystore (JKS) or PKCS12 file must open with the store password.
          if ! keytool -list -keystore "$DOCSAFE_UPLOAD_STORE_FILE" -storepass "$DOCSAFE_UPLOAD_STORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The decoded keystore does not open with UPLOAD_STORE_PASSWORD. Check that UPLOAD_KEYSTORE_BASE64 came from upload.jks and that the password is right."
            exit 1
          fi
          if ! keytool -list -keystore "$DOCSAFE_UPLOAD_STORE_FILE" -storepass "$DOCSAFE_UPLOAD_STORE_PASSWORD" -alias "$DOCSAFE_UPLOAD_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::No key with alias UPLOAD_KEY_ALIAS in the keystore (it is usually: upload)."
            exit 1
          fi
          flutter build appbundle --release -PdocsafeRequireUploadKey=true
      - name: Permissions in the bundle (no INTERNET expected)
        run: |
          unzip -p build/app/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml \
            | strings | grep -io 'android.permission.[A-Z_]*\|com.android.vending.BILLING' | sort -u
          if unzip -p build/app/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml | strings | grep -q 'android.permission.INTERNET'; then
            echo "::error::INTERNET permission found"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: document-scanner-pro-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 3
