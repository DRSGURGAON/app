# Seedha Chat (apps/seedha-chat-android): unit tests + lint + APK/AAB on GitHub's runners.
# Optional repo secrets for a Play-Store-signed build:
#   SEEDHA_KEYSTORE_BASE64, SEEDHA_KEYSTORE_PASSWORD, SEEDHA_KEY_ALIAS, SEEDHA_KEY_PASSWORD
# Without them the release APK is signed with the debug key (fine for testing, NOT for Play).
name: Seedha Chat APK
on:
  workflow_dispatch: {}
  push:
    paths: ["apps/seedha-chat-android/**", ".github/workflows/seedha-chat-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/seedha-chat-android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Release keystore (optional)
        env: { KS: "${{ secrets.SEEDHA_KEYSTORE_BASE64 }}" }
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "SEEDHA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease bundleRelease
        env:
          SEEDHA_KEYSTORE_PASSWORD: ${{ secrets.SEEDHA_KEYSTORE_PASSWORD }}
          SEEDHA_KEY_ALIAS: ${{ secrets.SEEDHA_KEY_ALIAS }}
          SEEDHA_KEY_PASSWORD: ${{ secrets.SEEDHA_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: seedha-chat-android
          path: |
            apps/seedha-chat-android/app/build/outputs/apk/release/*.apk
            apps/seedha-chat-android/app/build/outputs/bundle/release/*.aab
            apps/seedha-chat-android/app/build/reports/lint-results-debug.html
